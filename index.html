:10px;box-shadow:0 4px 12px #c98c7e42;min-width:0}.slotbox:nth-child(1){background:#ffe3e4}.slotbox:nth-child(2){background:#fff0c6}.slotbox:nth-child(3){background:#e2f4d9}.slotlabel{text-align:center;font-size:clamp(13px,2vw,25px);font-weight:900;margin-bottom:7px}.drop{height:clamp(55px,9vh,98px);border:3px dashed #d9a5a0;border-radius:17px;display:flex;align-items:center;justify-content:center;text-align:center;color:#9a7770;font-size:13px;font-weight:700;padding:5px}.slotbox:nth-child(2) .drop{border-color:#dbb660}.slotbox:nth-child(3) .drop{border-color:#9fc48b}.drop.over{background:#fff8f7;outline:3px solid #8bbff0}.drop.filled{font-size:clamp(17px,2.4vw,29px);color:#392921;background:#ffffffb8}.sectionlabel{font-size:12px;font-weight:900;letter-spacing:2px;margin:3px 0 0;color:#7d4d42}.tiles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.tile{border:2px solid #fff;box-shadow:0 3px 0 #d7b5a9,0 3px 9px #bc988455;border-radius:15px;padding:10px 12px;min-height:41px;touch-action:none;cursor:grab;font-size:clamp(11px,1.25vw,18px);font-weight:900;color:#3b2721;user-select:none;white-space:nowrap}.tile:active{cursor:grabbing}.tile.selected{outline:4px solid #547ad4}.tile.used{opacity:.35}.days .tile:nth-child(7n+1){background:#ffc1d2}.days .tile:nth-child(7n+2){background:#ffcfaa}.days .tile:nth-child(7n+3){background:#fff0a9}.days .tile:nth-child(7n+4){background:#d5efb7}.days .tile:nth-child(7n+5){background:#b9e2fc}.days .tile:nth-child(7n+6){background:#e0c6fa}.days .tile:nth-child(7n){background:#ffd1e6}.months .tile:nth-child(4n+1){background:#bfe3fc}.months .tile:nth-child(4n+2){background:#ffd2e0}.months .tile:nth-child(4n+3){background:#d4eec8}.months .tile:nth-child(4n){background:#ffe5aa}.dates .tile{padding:7px 9px;min-height:34px;background:#fff5c5;font-size:13px}.hint{text-align:center;color:#785e53;font-size:12px;margin-top:auto}.dragging{position:fixed!important;z-index:1000;pointer-events:none;opacity:.95;transform:scale(1.07)}@media(m </style></head><body><main class="stage"><aside class="portrait" aria-label="Smiling blonde teacher in a cheerful classroom"></aside><section class="content"><header class="head"><h1>🌈 CALENDAR</h1><button class="reset" id="reset" type="button">↻ RESET</button></header><div class="slots"><div class="slotbox"><div class="slotlabel">☀️ TODAY IS...</div><div class="drop" data-accept="day" aria-label="Drop day here">DRAG DAY HERE</div></div><div class="slotbox"><div class="slotlabel">🗓️ THE DATE IS...</div><div class="drop" data-accept="date" aria-label="Drop date here">DRAG DATE HERE</div></div><div class="slotbox"><div class="slotlabel">🌼 THE MONTH IS...</div><div class="drop" data-accept="month" aria-label="Drop month here">DRAG MONTH HERE</div></div></div><p class="sectionlabel">DAYS OF THE WEEK</p><div class="tiles days" id="days"></div><p class="sectionlabel">MONTHS OF THE YEAR</p><div class="tiles months" id="months"></div><p class="sectionlabel">WHAT'S THE DATE?</p><div class="tiles dates" id="dates"></div><p class="hint">Drag a card into its box, or tap a card and then tap its box. Press RESET to start again.</p></section></main><script>
const DAY=["MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY","SUNDAY"],MONTH=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];let selected=null,drag=null;const placeholders={day:"DRAG DAY HERE",month:"DRAG MONTH HERE",date:"DRAG DATE HERE"};function makeTiles(id,type,items){const host=document.getElementById(id);items.forEach(value=>{const el=document.createElement("button");el.type="button";el.className="tile";el.textContent=value;el.dataset.type=type;el.dataset.value=value;el.addEventListener("click",()=>{if(drag)return;document.querySelectorAll(".tile").forEach(x=>x.classList.remove("selected"));selected=el;el.classList.add("selected")});el.addEventListener("pointerdown",beginDrag);host.append(el)})}makeTiles("days","day",DAY);makeTiles("months","month",MONTH);makeTiles("dates","date",Array.from({length:31},(_,i)=>String(i+1)));function place(el,drop){if(!el||!drop||el.dataset.type!==drop.dataset.accept)return;drop.textContent=el.dataset.value;drop.classList.add("filled");document.querySelectorAll('.tile[data-type="'+el.dataset.type+'"]').forEach(x=>x.classList.remove("selected","used"));el.classList.add("used");selected=null}document.querySelectorAll(".drop").forEach(drop=>{drop.addEventListener("click",()=>place(selected,drop))});document.getElementById("reset").addEventListener("click",()=>{document.querySelectorAll(".drop").forEach(d=>{d.textContent=placeholders[d.dataset.accept];d.classList.remove("filled","over")});document.querySelectorAll(".tile").forEach(t=>t.classList.remove("selected","used"));selected=null});function beginDrag(e){if(e.button!==0)return;const el=e.currentTarget,rect=el.getBoundingClientRect();drag={el,x:e.clientX,y:e.clientY,dx:e.clientX-rect.left,dy:e.clientY-rect.top,moved:false,rect};el.setPointerCapture(e.pointerId);el.addEventListener("pointermove",moveDrag);el.addEventListener("pointerup",endDrag,{once:true});el.addEventListener("pointercancel",endDrag,{once:true})}function moveDrag(e){if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;if(!drag.moved){drag.moved=true;drag.el.classList.add("dragging");drag.el.style.width=drag.rect.width+"px";drag.el.style.height=drag.rect.height+"px"}drag.el.style.left=(e.clientX-drag.dx)+"px";drag.el.style.top=(e.clientY-drag.dy)+"px";document.querySelectorAll(".drop").forEach(d=>d.classList.remove("over"));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".drop");if(target&&target.dataset.accept===drag.el.dataset.type)target.classList.add("over")}function endDrag(e){const d=drag;if(!d)return;d.el.removeEventListener("pointermove",moveDrag);if(d.moved){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".drop");place(d.el,target);d.el.classList.remove("dragging");d.el.style.left="";d.el.style.top="";d.el.style.width="";d.el.style.height="";document.querySelectorAll(".drop").forEach(x=>x.classList.remove("over"));e.preventDefault()}drag=null}
</script></body></html>
