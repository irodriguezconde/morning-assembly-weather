<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Assembly — Weather</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f7e8da;font-family:'Trebuchet MS',Arial,sans-serif;overflow:hidden}#slide{position:relative;width:100vw;height:100vh;aspect-ratio:1648/928;background:url('weather-background.png') center/100% 100% no-repeat;touch-action:none} .hotspot{position:absolute;border:0;background:transparent;cursor:grab;touch-action:none;border-radius:15%;} .hotspot:focus-visible,.hotspot.selected{outline:4px solid #59b5ce;outline-offset:-5px;background:#ffffff30}.hotspot.dragging{opacity:.4}.target{position:absolute;left:36.1%;top:29%;width:49.7%;height:26.5%;border-radius:20px;display:flex;align-items:center;justify-content:center;touch-action:none}.result{display:none;align-items:center;justify-content:center;gap:1vw;background:#fff9f0ee;border:3px solid #e9c3ae;border-radius:20px;padding:1.5% 4%;box-shadow:0 5px 15px #ab8c7a55;color:#34302e;font-weight:900;font-size:clamp(17px,3.1vw,54px)}.result .symbol{font-size:1.7em}.target.filled .result{display:flex}.reset{position:absolute;right:1%;bottom:2%;width:15%;height:9%;border:0;background:transparent;cursor:pointer}.home{position:absolute;left:1%;bottom:2%;width:14%;height:9%;border:0;background:transparent;cursor:pointer}.hint{position:absolute;left:30%;bottom:2%;width:40%;text-align:center;color:#7e5c4c;font-size:clamp(9px,1vw,17px);background:#fff9;border-radius:20px;padding:4px}.ghost{position:fixed;pointer-events:none;z-index:20;background:#fff8ed;border:2px solid #d5b6a7;border-radius:16px;padding:8px 14px;font-weight:900;box-shadow:0 5px 16px #0003;transform:translate(-50%,-50%);white-space:nowrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style></head><body><main id="slide" aria-label="Interactive weather chart"><div id="target" class="target" role="button" tabindex="0" aria-label="Drop weather here"><div id="result" class="result"></div></div><button class="reset" id="reset" aria-label="Reset weather"></button><button class="home" id="home" aria-label="Return to Genially menu"></button><div class="hint" id="hint">Drag a weather card here, or tap a card and then the box.</div></main>
<script>
const data=[['SUNNY','☀️'],['CLOUDY','☁️'],['RAINY','🌧️'],['WINDY','💨'],['SNOWY','❄️'],['STORMY','⛈️'],['FOGGY','🌫️']];const slide=document.getElementById('slide'),target=document.getElementById('target'),result=document.getElementById('result'),hint=document.getElementById('hint');let selected=null,drag=null,ghost=null;
const bounds=[[7.2,65.4,12.1,22.2],[19.6,65.4,12,22.2],[32.1,65.4,12,22.2],[44.5,65.4,12,22.2],[56.9,65.4,12,22.2],[69.4,65.4,12,22.2],[81.9,65.4,12.7,22.2]];
function choose(i){selected=i;document.querySelectorAll('.hotspot').forEach((el,n)=>el.classList.toggle('selected',i===n));hint.textContent=`${data[i][0]} selected — tap the big box.`}function place(i){if(i===null)return;result.replaceChildren();const s=document.createElement('span');s.className='symbol';s.textContent=data[i][1];const t=document.createElement('span');t.textContent=data[i][0];result.append(s,t);target.classList.add('filled');selected=null;document.querySelectorAll('.hotspot').forEach(el=>el.classList.remove('selected'));hint.textContent='Great! Choose another card or press RESET.'}
function withinTarget(x,y){const r=target.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
for(let i=0;i<7;i++){let b=bounds[i],el=document.createElement('button');el.className='hotspot';el.style.cssText=`left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%`;el.setAttribute('aria-label',`Select ${data[i][0]}`);slide.appendChild(el);el.addEventListener('pointerdown',e=>{drag={i,x:e.clientX,y:e.clientY,moved:false};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!drag||drag.i!==i)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){drag.moved=true;if(!ghost){ghost=document.createElement('div');ghost.className='ghost';document.body.appendChild(ghost);ghost.textContent=data[i][1]+' '+data[i][0]}ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}});el.addEventListener('pointerup',e=>{if(!drag)return;let moved=drag.moved;drag=null;if(ghost){ghost.remove();ghost=null}if(moved&&withinTarget(e.clientX,e.clientY))place(i);else if(!moved)choose(i)});el.addEventListener('pointercancel',()=>{drag=null;if(ghost){ghost.remove();ghost=null}})}
target.addEventListener('click',()=>place(selected));target.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place(selected)}});document.getElementById('reset').addEventListener('click',()=>{target.classList.remove('filled');result.replaceChildren();selected=null;document.querySelectorAll('.hotspot').forEach(el=>el.classList.remove('selected'));hint.textContent='Drag a weather card here, or tap a card and then the box.'});document.getElementById('home').addEventListener('click',()=>{hint.textContent='Use the HOME arrow placed in Genially to return to the menu.'});
</script></body></html>
